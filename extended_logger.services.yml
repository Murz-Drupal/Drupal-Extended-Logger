services:
  extended_logger.logger:
    class: Drupal\extended_logger\Logger\ExtendedLogger
    arguments:
      - '@service_container'
      - '@Drupal\extended_logger\Logger\ExtendedLogMessageParser'
      - '@config.factory'
    tags:
      - name: logger

  Drupal\extended_logger\Logger\ExtendedLogMessageParser: ~
