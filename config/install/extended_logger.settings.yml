fields:
  - service.name
  - timestamp_float
  - message
  - message_raw
  - base_url
  - request_time_float
  - channel
  - ip
  - request_uri
  - referer
  - severity
  - level
  - uid
  - link
  - metadata
  - exception
fields_all: false
fields_custom: []
service_name: drupal
target: file
target_syslog_identity: drupal
target_syslog_facility: 128
target_file_path: temporary://drupal.log
target_output_stream: stderr
log_line_max_length: null
backlog_items_limit: 8
skip_event_dispatch: false
